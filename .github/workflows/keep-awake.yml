# Render's free plan puts the server to sleep after 15 minutes without visits, and waking it
# takes about a minute. A quick visit every 10 minutes keeps CIXCLE answering straight away.
# (One always-on free service uses about 720 of Render's 750 free hours a month.)
name: Keep server awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS --max-time 120 https://circle-server-mzjz.onrender.com/health || true
