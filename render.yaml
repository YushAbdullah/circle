# One-tap free hosting on Render: https://render.com/deploy?repo=https://github.com/YushAbdullah/circle
services:
  - type: web
    name: circle-server
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: APP_TOKEN
        generateValue: true
      - key: CLAUDE_MODEL
        value: claude-haiku-5-5
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
